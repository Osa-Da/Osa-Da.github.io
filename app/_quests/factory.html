<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктор конфигураций</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  html { font-size: 19px; }
  html,body{background:#070b12;color:#e5e7eb;height:100%;margin:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;}
  .card{background:#0f172a;border:1px solid #1e293b;}
  .field{background:rgba(0,0,0,.35);border:1px solid #334155;color:#e5e7eb;font-size:.95rem;width:100%;}
  .field:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.18);}
  .field.missing{border-color:rgba(239,68,68,.85);background:rgba(127,29,29,.18);}
  textarea.auto-grow{resize:none;overflow:hidden;min-height:44px;line-height:1.5;}
  .scroll::-webkit-scrollbar{width:11px;height:11px;}
  .scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:6px;}
  .scroll::-webkit-scrollbar-track{background:#0f172a;}
  .code-out{font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre;}
  input,textarea,select{color-scheme:dark;}
  .lbl{font-size:.82rem;color:#94a3b8;margin-bottom:5px;font-weight:500;}
  .hint{font-size:.78rem;color:#64748b;margin-top:4px;}
  .req-mark{color:#ef4444;font-weight:700;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:#94a3b8;font-size:.95rem;transition:all .12s;border:1px solid transparent;}
  .nav-btn:hover{background:rgba(255,255,255,.05);color:#e5e7eb;}
  .nav-btn.active{background:rgba(59,130,246,.18);color:#93c5fd;border-color:rgba(59,130,246,.4);font-weight:600;}
  .tab{padding:14px 22px;border-bottom:3px solid transparent;cursor:pointer;font-size:1rem;color:#94a3b8;transition:all .15s;}
  .tab:hover{color:#cbd5e1;background:rgba(255,255,255,.03);}
  .tab.active{border-bottom-color:#3b82f6;color:#60a5fa;font-weight:600;background:rgba(59,130,246,.08);}
  details>summary{cursor:pointer;list-style:none;}
  details>summary::-webkit-details-marker{display:none;}
  details>summary .chev{transition:transform .15s;}
  details[open]>summary .chev{transform:rotate(90deg);}
  .sec-head{position:sticky;top:0;z-index:10;background:#0f172a;border-bottom:1px solid #1e293b;padding:16px 22px;}
  details[open]>.sec-head{box-shadow:0 4px 14px rgba(0,0,0,.5);}
  .code-card{border-left:5px solid #475569;background:#0f172a;transition:all .1s;}
  .code-card:hover{background:#131e35;}
  .code-card.t-reveal{border-color:#94a3b8;}
  .code-card.t-features{border-color:#f59e0b;}
  .code-card.t-ability{border-color:#3b82f6;}
  .code-card.t-quest{border-color:#10b981;}
  .code-card.t-targets{border-color:#a78bfa;}
  .badge{font-size:.72rem;padding:3px 9px;border-radius:5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
  .badge-lib{background:rgba(167,139,250,.25);color:#c4b5fd;}
  .badge-fac{background:rgba(59,130,246,.25);color:#93c5fd;}
  .b-reveal{background:rgba(148,163,184,.2);color:#cbd5e1;}
  .b-features{background:rgba(245,158,11,.2);color:#fcd34d;}
  .b-ability{background:rgba(59,130,246,.2);color:#93c5fd;}
  .b-quest{background:rgba(16,185,129,.2);color:#6ee7b7;}
  .b-targets{background:rgba(167,139,250,.2);color:#c4b5fd;}
  .chip{font-size:.82rem;padding:4px 11px;border-radius:9999px;border:1px solid;display:inline-flex;align-items:center;gap:5px;}
  .chip-ok{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.4);color:#6ee7b7;}
  .chip-fail{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#fca5a5;}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:#0f172a;border:1px solid #334155;border-radius:14px;max-width:960px;width:100%;max-height:88vh;display:flex;flex-direction:column;}
  .icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;padding:16px;}
  .icon-cell{padding:12px 6px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:#cbd5e1;}
  .icon-cell:hover{background:rgba(59,130,246,.18);border-color:#3b82f6;color:#fff;}
  .icon-cell svg{width:24px;height:24px;}
  .icon-cell span{font-size:.68rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-preview{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:9px;background:rgba(59,130,246,.1);border:1px solid #334155;flex-shrink:0;}
  .icon-preview svg{width:22px;height:22px;color:#93c5fd;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:.92rem;font-weight:500;cursor:pointer;transition:all .15s;border:none;}
  .btn:hover{filter:brightness(1.12);}
  .btn-blue{background:#2563eb;color:#fff;}
  .btn-green{background:#059669;color:#fff;}
  .btn-purple{background:#7c3aed;color:#fff;}
  .btn-gray{background:#334155;color:#e5e7eb;}
  .btn-red{background:#991b1b;color:#fecaca;}
  .btn-ghost{background:transparent;color:#94a3b8;border:1px solid #334155;}
  .btn-ghost:hover{background:rgba(255,255,255,.05);}
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#065f46;color:#d1fae5;padding:14px 26px;border-radius:11px;z-index:200;font-size:.95rem;box-shadow:0 10px 30px rgba(0,0,0,.55);animation:slideUp .2s;max-width:80vw;text-align:center;}
  .toast.err{background:#7f1d1d;color:#fecaca;}
  @keyframes slideUp{from{transform:translate(-50%,22px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
  .item-row{border:1px solid #1e293b;border-radius:10px;background:rgba(0,0,0,.2);padding:14px;margin-bottom:12px;}
  .item-row.ref{border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.05);}
  .item-row.fac-ref{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.05);}
  .item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #1e293b;}
  .pill{font-size:.75rem;padding:3px 10px;border-radius:9999px;background:rgba(255,255,255,.06);color:#94a3b8;}
</style>
</head>
<body>
<div id="app" class="h-screen flex flex-col"></div>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
/* ============================================================
   КОНСТАНТЫ
   ============================================================ */
const DEFAULT_FACTIONS = {
  ЭКИПАЖ:      { name:'Экипаж',      teamInfo:'Общая цель экипажа: спасти всех пассажиров и починить рацию, чтобы вызвать подмогу.', features:[], abilities:[], quests:[] },
  БАНДА:       { name:'Банда',       teamInfo:'Общая цель банды: найти чип и сбежать самостоятельно, не вызывая спасателей.',        features:[], abilities:[], quests:[] },
  МЕСТНЫЕ:     { name:'Местные',     teamInfo:'Вы бежите с севера вместе. Но вместе — не значит навсегда.',                          features:[], abilities:[], quests:[] },
  НЕЗАВИСИМАЯ: { name:'Одиночка',    teamInfo:'Действуете в одиночку. Никому не доверяете — но можете временно сгруппироваться с кем угодно.', features:[], abilities:[], quests:[] },
  ГРАЖДАНСКИЙ: { name:'Гражданский', teamInfo:'Действуете сами по себе. Ваша цель — выжить.',                                      features:[], abilities:[], quests:[] },
};

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const S = {
  game: null,
  section: 'characters',
  selectedCode: null,
  charTab: 'info',
  editingCode: null,
  libKind: 'features',
  selectedFaction: null,
  fileHandle: null,
  fileName: null,
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
const escA = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const escH = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// JS-string-escape + HTML-attr-escape, безопасно для onclick="f('...')"
const escJs = s => String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'\\r');
const escOn = s => escA(escJs(s));
const isBlank = v => v === undefined || v === null || (typeof v === 'string' && !v.trim());
const getPath = (o,p) => p.split('.').reduce((a,k)=>a?.[k], o);
function setPath(o,p,v){
  const parts = p.split('.');
  const last = parts.pop();
  let t = o;
  for (const k of parts){
    if (t[k] === undefined || t[k] === null) t[k] = {};
    t = t[k];
  }
  t[last] = v;
}
function uid(prefix){ return (prefix||'it') + '_' + Math.random().toString(36).slice(2,9); }
function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  $('toastHost').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function autoGrow(el){ if (!el || el.tagName!=='TEXTAREA') return; el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function autoGrowAll(root){ (root||document).querySelectorAll('textarea.auto-grow').forEach(autoGrow); }

let _draftTimer = null;
function saveDraft(){
  if (_draftTimer) clearTimeout(_draftTimer);
  _draftTimer = setTimeout(()=>{
    if (!S.game) return;
    try {
      localStorage.setItem('editor_draft', JSON.stringify({
        game: S.game, section: S.section, selectedCode: S.selectedCode,
        charTab: S.charTab, libKind: S.libKind, selectedFaction: S.selectedFaction,
        fileName: S.fileName,
      }));
    } catch(e){}
  }, 250);
}
function clearDraft(){ try { localStorage.removeItem('editor_draft'); } catch(e){} }

/* ============================================================
   ПАРСИНГ
   ============================================================ */
function parseConfig(text){
  if (!text || !text.trim()) return { error:'Пустой текст' };
  const tryEval = (src)=>{ try{ const fn=new Function('"use strict";\n'+src+'\n;return typeof GAME!=="undefined"?GAME:null;'); const g=fn(); if(g&&g.characters) return g; }catch(e){} return null; };
  const tryJSON = (src)=>{ try{ const j=JSON.parse(src); return (j&&j.characters)?j:null; }catch(e){ return null; } };
  const tryParen= (src)=>{ try{ const fn=new Function('return ('+src+');'); const g=fn(); return (g&&g.characters)?g:null; }catch(e){ return null; } };
  const g = tryEval(text) || tryJSON(text) || tryParen(text);
  if (!g) return { error:'Не удалось распознать конфиг. Нужен const GAME = {...} или JSON с "characters".' };
  return { game: normalizeGame(g) };
}

function normalizeCodeEntry(entry, library){
  if (!entry || typeof entry !== 'object') return entry;
  const out = { ...entry };
  // поддержка нового (_libRef) и старого ($libRef) маркеров
  const refKey = out._libRef || out.$libRef;
  if (refKey){
    const type = out.type;
    const kind = type === 'features' ? 'features' : type === 'ability' ? 'abilities' : type === 'quest' ? 'quests' : null;
    if (kind && (library[kind]||[]).some(x => x.id === refKey)){
      const ref = { id: out.id || uid('code'), _libRef: refKey };
      if (out.type) ref.type = out.type;
      if (out.reveal !== undefined) ref.reveal = out.reveal;
      if (out.targets) ref.targets = [...out.targets];
      if (out.key) ref.key = out.key;
      return ref;
    }
  }
  delete out._libRef;
  delete out.$libRef;
  return out;
}
function normalizeItemEntry(item, kind, library){
  if (!item || typeof item !== 'object') return item;
  // уже in-memory ссылка — не трогаем
  if (item._lib || item._fac) return item;
  // ссылки в data-формате: новый (_libId) и старый ($lib)
  const refKey = item._libId || item.$lib;
  if (refKey && (library[kind]||[]).some(x => x.id === refKey)){
    return { id: uid('it'), _lib: refKey };
  }
  const clean = { ...item };
  delete clean._libId;
  delete clean.$lib;
  delete clean._fromFaction;
  if (!clean.id) clean.id = uid('it');
  return clean;
}
function normalizeGame(g){
  const out = clone(g);
  out.id = out.id || 'game';
  out.title = out.title || 'Без названия';
  out.glossary = out.glossary || [];
  out.characters = out.characters || {};

  if (!out.library) out.library = { features:[], abilities:[], quests:[], codes:[] };
  out.library.features  = out.library.features  || [];
  out.library.abilities = out.library.abilities || [];
  out.library.quests    = out.library.quests    || [];
  out.library.codes     = out.library.codes     || [];
  ['features','abilities','quests','codes'].forEach(k=>{
    out.library[k].forEach(it=>{ if (!it.id) it.id = uid(k.slice(0,1)); });
  });

  if (!out.factions){
    out.factions = {};
    for (const code in out.characters){
      const c = out.characters[code];
      let raw = (c.faction || 'Независимая').trim();
      let key = raw.toUpperCase().replace(/\s+/g,'_');
      if (key === 'НЕЗАВИСИМАЯ'){
        if (!out.factions[key]) out.factions[key] = { name:'Одиночка', teamInfo:c.teamInfo || DEFAULT_FACTIONS.НЕЗАВИСИМАЯ.teamInfo, features:[], abilities:[], quests:[] };
      } else if (!out.factions[key]){
        out.factions[key] = { name: raw, teamInfo: c.teamInfo || '', features:[], abilities:[], quests:[] };
      }
    }
    for (const k in DEFAULT_FACTIONS){
      if (!out.factions[k]) out.factions[k] = clone(DEFAULT_FACTIONS[k]);
    }
  }
  for (const k in out.factions){
    out.factions[k].features  = out.factions[k].features  || [];
    out.factions[k].abilities = out.factions[k].abilities || [];
    out.factions[k].quests    = out.factions[k].quests    || [];
    out.factions[k].name      = out.factions[k].name || k;
    out.factions[k].teamInfo  = out.factions[k].teamInfo || '';
    ['features','abilities','quests'].forEach(kk=>{
      out.factions[k][kk] = out.factions[k][kk].map(it => normalizeItemEntry(it, kk, out.library));
    });
  }

  for (const code in out.characters){
    const c = out.characters[code];
    c.features  = c.features  || [];
    c.abilities = c.abilities || [];
    c.quests    = c.quests    || [];
    c.inventory = c.inventory || [];
    c.codeSystem= c.codeSystem|| {};

    ['features','abilities','quests'].forEach(kk=>{
      c[kk] = c[kk].map(it => normalizeItemEntry(it, kk, out.library));
    });
    c.inventory = c.inventory.map(it => { if (!it.id) it.id = uid('it'); return it; });
    for (const k in c.codeSystem){
      c.codeSystem[k] = normalizeCodeEntry(c.codeSystem[k], out.library);
    }

    if (!c.factionKey){
      const raw = (c.faction || 'Независимая').trim();
      let key = raw.toUpperCase().replace(/\s+/g,'_');
      if (!out.factions[key]){
        for (const k in out.factions){ if (out.factions[k].name === raw){ key = k; break; } }
      }
      c.factionKey = key;
    }
    if (out.factions[c.factionKey]) c.faction = out.factions[c.factionKey].name;
  }

  for (let i = 0; i < out.library.codes.length; i++){
    out.library.codes[i] = normalizeCodeEntry(out.library.codes[i], out.library);
  }

  return out;
}

/* ============================================================
   РЕЗОЛВ ССЫЛОК
   ============================================================ */
function itemSource(item){
  if (!item) return 'own';
  if (item._lib) return 'lib';
  if (item._fac) return 'fac';
  return 'own';
}
function resolveItem(item, kind, game){
  if (!item) return null;
  if (item._lib){
    const list = game.library[kind] || [];
    return list.find(x=>x.id === item._lib) || null;
  }
  if (item._fac){
    const [fk, iid] = item._fac.split(':');
    const fac = game.factions[fk];
    if (!fac) return null;
    const facItem = (fac[kind] || []).find(x=>x.id === iid);
    if (!facItem) return null;
    return resolveItem(facItem, kind, game);
  }
  return item;
}
function cleanItem(item){
  const c = {...item};
  delete c.id; delete c._lib; delete c._fac;
  delete c.$lib; delete c.$libRef; delete c._libId; delete c._libRef;
  delete c._fromFaction;
  // убираем пустые вложенные объекты, чтобы не мусорить
  for (const k of ['rewards','rewardsDescription','content']){
    if (c[k] && typeof c[k] === 'object' && !Object.keys(c[k]).filter(x => c[k][x]).length) delete c[k];
  }
  return c;
}
function cleanLibraryItem(item){
  // id СОХРАНЯЕТСЯ — на него могут ссылаться другие элементы
  const c = {...item};
  delete c._lib; delete c._fac; delete c.$lib; delete c.$libRef;
  delete c._libId; delete c._libRef; delete c._fromFaction;
  return c;
}

/* ============================================================
   ГЕНЕРАЦИЯ JS
   ============================================================ */
function safeKey(k){ return /^[\p{L}_$][\p{L}\p{N}_$]*$/u.test(k) ? k : JSON.stringify(k); }
function ser(v, ind){
  const pad='  '.repeat(ind), pad1='  '.repeat(ind+1);
  if (v===null) return 'null';
  if (v===undefined) return 'undefined';
  if (typeof v==='string') return JSON.stringify(v);
  if (typeof v==='number'||typeof v==='boolean') return String(v);
  if (Array.isArray(v)){
    if(!v.length) return '[]';
    return '[\n'+v.map(x=>pad1+ser(x,ind+1)).join(',\n')+'\n'+pad+']';
  }
  const keys=Object.keys(v).filter(k=>v[k]!==undefined);
  if(!keys.length) return '{}';
  return '{\n'+keys.map(k=>pad1+safeKey(k)+': '+ser(v[k],ind+1)).join(',\n')+'\n'+pad+'}';
}
function expandLibraryItem(item, kind){
  if (!item || typeof item !== 'object') return item;
  const src = itemSource(item);
  if (src === 'own') return cleanItem(item);
  if (src === 'lib'){
    const libItem = (S.game.library[kind]||[]).find(x => x.id === item._lib);
    if (!libItem) return cleanItem(item);
    const clean = cleanItem(libItem);
    return { _libId: item._lib, ...clean };
  }
  if (src === 'fac'){
    const [fk, iid] = item._fac.split(':');
    const facItem = (S.game.factions[fk]?.[kind]||[]).find(x => x.id === iid);
    if (!facItem) return cleanItem(item);
    if (facItem._lib){
      const libItem = (S.game.library[kind]||[]).find(x => x.id === facItem._lib);
      if (libItem){
        const clean = cleanItem(libItem);
        return { _libId: facItem._lib, ...clean };
      }
    }
    return cleanItem(facItem);
  }
  return cleanItem(item);
}
function expandCodeEntry(entry){
  const out = {};
  if (!entry || typeof entry !== 'object') return out;
  if (entry.type) out.type = entry.type;
  if (entry.reveal !== undefined) out.reveal = entry.reveal;
  if (entry.targets) out.targets = [...entry.targets];

  if (entry._libRef){
    const t = entry.type;
    const kind = t === 'features' ? 'features' : t === 'ability' ? 'abilities' : t === 'quest' ? 'quests' : null;
    if (kind){
      const libItem = (S.game.library[kind]||[]).find(x => x.id === entry._libRef);
      if (libItem){
        out._libRef = entry._libRef;
        if (t === 'quest'){
          out.name = libItem.title || libItem.name || '';
          out.content = { description: libItem.description || '' };
          if (libItem.details) out.content.details = libItem.details;
          if (libItem.icon) out.icon = libItem.icon;
        } else {
          out.name = libItem.name || '';
          out.description = libItem.description || '';
          if (libItem.icon) out.icon = libItem.icon;
          if (libItem.details) out.details = libItem.details;
        }
        return out;
      } else {
        out._libRef = entry._libRef;
        out.name = '⚠ Ссылка не найдена';
        out.description = 'Сущность с id «' + entry._libRef + '» отсутствует в библиотеке. Откройте этот код и выберите заново.';
        return out;
      }
    }
  }
  if (entry.name) out.name = entry.name;
  if (entry.description) out.description = entry.description;
  if (entry.details) out.details = entry.details;
  if (entry.icon) out.icon = entry.icon;
  if (entry.content) out.content = {...entry.content};
  return out;
}
function generateJS(){
  if (!S.game) return '';
  const out = {
    id: S.game.id,
    title: S.game.title,
    glossary: clone(S.game.glossary || []),
    library: {
      features:  (S.game.library.features||[]).map(cleanLibraryItem),
      abilities: (S.game.library.abilities||[]).map(cleanLibraryItem),
      quests:    (S.game.library.quests||[]).map(cleanLibraryItem),
      codes:     (S.game.library.codes||[]).map(lc => {
        const base = { id: lc.id, key: lc.key };
        return { ...base, ...expandCodeEntry(lc) };
      }),
    },
    characters: {},
  };

  for (const code in S.game.characters){
    const c = S.game.characters[code];
    const outC = {};
    for (const f of ['name','title','faction','legend','trueNature','fact']){
      if (c[f] !== undefined && c[f] !== '') outC[f] = c[f];
    }
    const fac = S.game.factions[c.factionKey];
    if (fac && fac.teamInfo) outC.teamInfo = fac.teamInfo;
    else if (c.teamInfo)     outC.teamInfo = c.teamInfo;

    outC.features  = (c.features  || []).map(it => expandLibraryItem(it, 'features'));
    outC.abilities = (c.abilities || []).map(it => expandLibraryItem(it, 'abilities'));
    outC.quests    = (c.quests    || []).map(it => expandLibraryItem(it, 'quests'));
    outC.inventory = (c.inventory || []).map(cleanItem);

    const cs = {};
    for (const k in (c.codeSystem || {})){
      cs[k] = expandCodeEntry(c.codeSystem[k]);
    }
    outC.codeSystem = cs;
    out.characters[code] = outC;
  }

  return '/* Автогенерация: ' + (S.fileName || S.game.id || 'game') + ' */\n' +
         'const GAME = ' + ser(out, 0) + ';\n';
}

async function openFile(){
  if (window.showOpenFilePicker && window.isSecureContext){
    try{
      const [h] = await window.showOpenFilePicker({
        types:[{description:'JS / JSON', accept:{'text/javascript':['.js'],'application/json':['.json']}}],
        multiple:false,
      });
      const file = await h.getFile();
      const r = parseConfig(await file.text());
      if (r.error){ toast(r.error, true); return; }
      S.game = r.game;
      S.selectedCode = Object.keys(S.game.characters)[0] || null;
      S.selectedFaction = Object.keys(S.game.factions)[0] || null;
      S.editingCode = null; S.section = 'characters'; S.charTab = 'info';
      S.fileHandle = h; S.fileName = file.name;
      renderMain();
      toast('Открыт: ' + file.name);
    }catch(e){ if(e.name!=='AbortError') toast('Ошибка: '+e.message, true); }
  } else {
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.js,.json';
    inp.onchange = async ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = parseConfig(await f.text());
      if (r.error){ toast(r.error, true); return; }
      S.game = r.game;
      S.selectedCode = Object.keys(S.game.characters)[0] || null;
      S.selectedFaction = Object.keys(S.game.factions)[0] || null;
      S.fileHandle = null; S.fileName = f.name;
      S.section = 'characters'; S.charTab = 'info';
      renderMain();
      toast('Загружен: ' + f.name);
    };
    inp.click();
  }
}

function downloadAsFile(text, filename){
  try {
    const blob = new Blob([text], { type:'text/javascript;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { a.remove(); URL.revokeObjectURL(url); } catch(e){} }, 3000);
    toast('Скачано: ' + filename);
  } catch(e){
    console.error(e);
    toast('Ошибка скачивания: ' + e.message, true);
  }
}

async function saveFile(as){
  if (!S.game){ toast('Нет игры для сохранения', true); return; }

  let js = '';
  try { js = generateJS(); }
  catch(e){ console.error('generateJS:', e); toast('Ошибка генерации: ' + e.message, true); return; }

  if (!js || js.length < 30){
    toast('Сгенерировано пустое содержимое — сохранять нечего', true);
    return;
  }

  const fname = (S.fileName || (S.game.id || 'game') + '.js').replace(/\.json$/i, '.js');

  if (S.fileHandle && !as){
    try {
      let perm = await S.fileHandle.queryPermission({ mode:'readwrite' });
      if (perm !== 'granted'){
        perm = await S.fileHandle.requestPermission({ mode:'readwrite' });
      }
      if (perm === 'granted'){
        const w = await S.fileHandle.createWritable();
        try {
          await w.write(js);
          await w.close();
          S.fileName = S.fileHandle.name || fname;
          updateHeaderFile();
          saveDraft();
          toast('Сохранено: ' + S.fileName);
          return;
        } catch(we){
          try { await w.abort(); } catch(e){}
          console.error('write failed:', we);
        }
      }
    } catch(e){
      console.error('overwrite:', e);
    }
    downloadAsFile(js, fname);
    return;
  }

  if (window.showSaveFilePicker && window.isSecureContext){
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fname,
        types:[{ description:'JavaScript', accept:{ 'text/javascript':['.js'] } }],
      });
      const w = await handle.createWritable();
      try {
        await w.write(js);
        await w.close();
      } catch(we){
        try { await w.abort(); } catch(e){}
        throw we;
      }
      S.fileHandle = handle;
      S.fileName = handle.name || fname;
      updateHeaderFile();
      saveDraft();
      toast('Сохранено: ' + S.fileName);
      return;
    } catch(e){
      if (e && e.name === 'AbortError') return;
      console.error('showSaveFilePicker:', e);
    }
  }

  downloadAsFile(js, fname);
}

/* проверка дубликатов имён внутри одного персонажа — движок хранит прогресс по именам */
function findDuplicateNames(ch, game){
  const dups = [];
  ['features','abilities','quests'].forEach(kind => {
    const seen = new Map();
    (ch[kind]||[]).forEach((it) => {
      const resolved = resolveItem(it, kind, game) || it;
      const name = kind === 'quests' ? (resolved.title || resolved.name) : resolved.name;
      if (!name) return;
      if (seen.has(name)) dups.push(`дубликат имени «${name}» в ${kind}`);
      else seen.set(name, true);
    });
  });
  return dups;
}

function doAddLibCode(){
  const raw = prompt('Код (UPPERCASE):');
  if (!raw) return;
  const key = raw.trim().toUpperCase().replace(/\s+/g,'_');
  if (!key) return;
  if ((S.game.library.codes||[]).some(x=>x.key === key)){ toast('Такой код уже есть', true); return; }

  S.game.library.codes.push({ id: uid('lc'), key, type: 'reveal', reveal: '' });
  S.editingCode = 'lib:' + (S.game.library.codes.length - 1);
  renderMain();
}

function setLibCodeSrc(i, mode){
  const it = S.game.library.codes[i];
  if (!it) return;
  if (mode === 'ref'){ if (!('_libRef' in it)) it._libRef = ''; }
  else { delete it._libRef; }
  renderTabContent();
  if (window.lucide) lucide.createIcons();
}
function doDelLibCode(i){
  if (!confirm('Удалить общий код?')) return;
  S.game.library.codes.splice(i,1);
  S.editingCode = null;
  renderMain();
}

function renderCodeCard(key, val){
  const type = detectCodeType(val);
  const eff = getCodeEffects(key, S.selectedCode, val);
  const isEditing = S.editingCode === key;
  return `<div onclick="doEditCode('${escOn(key)}')" class="code-card t-${type} rounded-lg p-4 cursor-pointer ${isEditing?'ring-2 ring-purple-500':''}">
    <div class="flex items-center justify-between mb-3 gap-2">
      <div class="font-mono text-sm text-gray-100 font-semibold truncate">${escH(key)}</div>

function doEditCode(key){
  S.editingCode = key;
  renderTabContent();
  if (window.lucide) lucide.createIcons();
  setTimeout(()=>{ $('codeEditorWrap')?.scrollIntoView({behavior:'smooth', block:'start'}); }, 40);
}
function doAddCode(){
  const raw = prompt('Код (UPPERCASE):');
  if (!raw) return;
  const key = raw.trim().toUpperCase().replace(/\s+/g,'_');
  if (!key) return;
  if (key.includes('.')){ toast('Точки недопустимы', true); return; }
  const ch = S.game.characters[S.selectedCode];
  ch.codeSystem = ch.codeSystem || {};
  if (ch.codeSystem[key]){ toast('Такой код уже есть', true); return; }
  ch.codeSystem[key] = { reveal:'' };
  S.editingCode = key;
  renderMain();
}
function doDelCode(){
  if (!S.editingCode) return;
  if (!confirm('Удалить код ' + S.editingCode + '?')) return;
  delete S.game.characters[S.selectedCode].codeSystem[S.editingCode];
  S.editingCode = null;
  renderMain();
}
function renderCodeEditor(){
  const key = S.editingCode;
  const ch = S.game.characters[S.selectedCode];
  const val = ch.codeSystem[key];

              <input type="checkbox" ${fail?'checked':''} data-quest-bind="${i}" data-kind="fail" class="w-4 h-4 accent-red-500"/>

/* ============================================================
   ТИП КОДА И ЭФФЕКТЫ
   ============================================================ */
function detectCodeType(v){
  if (!v || typeof v !== 'object') return 'raw';
  if ('targets' in v) return 'targets';
  const t = Array.isArray(v.type) ? v.type[0] : v.type;
  if (t === 'features') return 'features';
  if (t === 'ability')  return 'ability';
  if (t === 'quest')    return 'quest';
  if ('reveal' in v)    return 'reveal';
  const keys = Object.keys(v).filter(k => !k.startsWith('_') && k !== 'id' && k !== 'key' && k !== '$libRef' && k !== '_libRef');
  if (keys.length === 1 && typeof v[keys[0]] === 'string') return 'reveal';
  return 'raw';
}
function codeTypeLabel(t){ return {reveal:'текст', features:'особенность', ability:'способность', quest:'задание', targets:'каскад', raw:'прочее'}[t] || t; }
function codeTypeBadgeClass(t){ return {reveal:'b-reveal', features:'b-features', ability:'b-ability', quest:'b-quest', targets:'b-targets', raw:'b-reveal'}[t] || 'b-reveal'; }
function getCodeEffects(codeKey, charCode, codeObj){
  const effects = { codeKey, type:'raw', items:[], quests:[] };
  const cd = codeObj || (charCode && S.game.characters[charCode]?.codeSystem?.[codeKey]);
  if (cd){
    const t = detectCodeType(cd);
    effects.type = t;
    if (t === 'reveal'){
      const txt = cd.reveal || '';
      effects.items.push({icon:'message-square', text:'Показать сообщение: «' + txt + '»'});
    } else if (t === 'features' || t === 'ability'){
      let name = cd.name, desc = cd.description;
      if ('_libRef' in cd && cd._libRef){
        const kind = t === 'features' ? 'features' : 'abilities';
        const item = (S.game.library[kind] || []).find(x=>x.id === cd._libRef);
        if (item){ name = item.name; desc = item.description; }
        effects.items.push({icon:'library', text:'Ссылается на библиотеку: ' + (name || '— не выбрано —')});
      }
      effects.items.push({icon: t==='features'?'star':'zap',
        text: (t==='features'?'Открывает особенность: ':'Даёт способность: ') + '«' + (name||'') + '»'});
      if (desc) effects.items.push({icon:'file-text', text: desc});
    } else if (t === 'quest'){
      let name = cd.name, desc = cd.content?.description;
      if ('_libRef' in cd && cd._libRef){
        const item = (S.game.library.quests || []).find(x=>x.id === cd._libRef);
        if (item){ name = item.title; desc = item.description; }
      }
      effects.items.push({icon:'target', text:'Открывает задание: «' + (name||'') + '»'});
      if (desc) effects.items.push({icon:'file-text', text: desc});
    } else if (t === 'targets'){
      (cd.targets||[]).forEach(t2 => effects.items.push({icon:'git-branch', text:'Запускает код: ' + t2}));
    } else if (t === 'raw'){
      effects.items.push({icon:'code', text:'Произвольный объект'});
    }
  }
  if (charCode){
    const ch = S.game.characters[charCode];
    (ch.quests||[]).forEach(q=>{
      const resolved = resolveItem(q, 'quests', S.game) || q;
      if ((resolved.successfulCodes||[]).includes(codeKey)) effects.quests.push({title: resolved.title, kind:'ok'});
      if ((resolved.failedCodes||[]).includes(codeKey))     effects.quests.push({title: resolved.title, kind:'fail'});
    });
    for (const k in (ch.codeSystem||{})){
      const c = ch.codeSystem[k];
      if (c.type === 'quest'){
        if ((c.successfulCodes||[]).includes(codeKey)) effects.quests.push({title:c.name||k, kind:'ok'});
        if ((c.failedCodes||[]).includes(codeKey))     effects.quests.push({title:c.name||k, kind:'fail'});
      }
    }
  }
  if (!effects.items.length) effects.items.push({icon:'help-circle', text:'— ничего не делает —'});
  return effects;
}

  let js = '';

  navigator.clipboard.writeText(js).then(

function selectChar(code){ S.selectedCode = code; S.editingCode = null; renderMain(); }
function selectFaction(k){ S.selectedFaction = k; renderMain(); }

function doAddChar(){
  const raw = prompt('Код персонажа (латиница, UPPERCASE):');
  if (!raw) return;
  const code = raw.trim().toUpperCase().replace(/\s+/g,'_');
  if (!code) return;
  if (S.game.characters[code]){ toast('Такой код уже есть', true); return; }
  const fk = Object.keys(S.game.factions)[0] || 'НЕЗАВИСИМАЯ';
  const fac = S.game.factions[fk];
  const newC = {
    name:'Новый персонаж', title:'', faction: fac.name, factionKey: fk,
    teamInfo:'', legend:'', trueNature:'', fact:'',
    features:[], abilities:[], quests:[], inventory:[], codeSystem:{}
  };
  autoInheritFaction(newC, fk);
  S.game.characters[code] = newC;
  S.selectedCode = code;
  renderMain();
}
function doDelChar(){
  if (!confirm('Удалить персонажа ' + S.selectedCode + '?')) return;
  delete S.game.characters[S.selectedCode];
  S.selectedCode = Object.keys(S.game.characters)[0] || null;
  S.editingCode = null;
  renderMain();
}
function doAddFaction(){
  const raw = prompt('Ключ фракции (UPPERCASE):');
  if (!raw) return;
  const key = raw.trim().toUpperCase().replace(/\s+/g,'_');
  if (!key) return;
  if (S.game.factions[key]){ toast('Такая фракция есть', true); return; }
  S.game.factions[key] = { name:key, teamInfo:'', features:[], abilities:[], quests:[] };
  S.selectedFaction = key;
  renderMain();
}
function doDelFaction(){
  if (!S.selectedFaction) return;
  const key = S.selectedFaction;
  if (!confirm('Удалить фракцию ' + key + '?')) return;
  delete S.game.factions[key];
  const fallback = Object.keys(S.game.factions)[0] || 'НЕЗАВИСИМАЯ';
  for (const c of Object.values(S.game.characters)){
    if (c.factionKey === key){
      c.factionKey = fallback;
      c.faction = S.game.factions[fallback]?.name || 'Одиночка';
    }
  }
  S.selectedFaction = fallback;
  renderMain();
}
function doExit(){
  if (!confirm('Вернуться на стартовый экран? Несохранённые изменения потеряются.')) return;
  S.game = null; S.selectedCode = null; S.selectedFaction = null;
  S.editingCode = null; S.charTab = 'info'; S.section = 'characters';
  S.fileHandle = null; S.fileName = null;

}

/* ============================================================
   АВТОНАСЛЕДОВАНИЕ
   ============================================================ */
function autoInheritFaction(char, factionKey){
  const fac = S.game.factions[factionKey];
  if (!fac) return;
  char.features  = (char.features  || []).filter(x => !x._fac);
  char.abilities = (char.abilities || []).filter(x => !x._fac);
  char.quests    = (char.quests    || []).filter(x => !x._fac);
  (fac.features  || []).forEach(it => char.features.push({  id: uid('it'), _fac: factionKey + ':' + it.id }));
  (fac.abilities || []).forEach(it => char.abilities.push({ id: uid('it'), _fac: factionKey + ':' + it.id }));
  (fac.quests    || []).forEach(it => char.quests.push({    id: uid('it'), _fac: factionKey + ':' + it.id }));
}

/* ============================================================
   ОТВЯЗКА
   ============================================================ */
function detachIfNeeded(path){
  // матчит в т.ч. вложенные пути: characters.X.quests.0.rewards.COMPLETED
  const m = path.match(/^(.+\.(?:features|abilities|quests))\.(\d+)(?:\.|$)/);
  if (!m) return false;
  const listPath = m[1];
  const idx = parseInt(m[2]);
  const kind = listPath.endsWith('.features') ? 'features' : listPath.endsWith('.abilities') ? 'abilities' : 'quests';
  const arr = getPath(S.game, listPath);
  if (!arr || !arr[idx]) return false;
  const item = arr[idx];
  const src = itemSource(item);
  if (src === 'own') return false;
  const resolved = resolveItem(item, kind, S.game);
  if (!resolved) return false;
  const copy = clone(resolved);
  delete copy.id; delete copy._lib; delete copy._fac; delete copy.$lib;
  delete copy._libId; delete copy._libRef; delete copy._fromFaction;
  copy.id = uid('it');
  arr[idx] = copy;
  return true;
}

/* ============================================================
   ОБРАБОТЧИКИ
   ============================================================ */
function attachHandlers(){
  const app = $('app');

  app.addEventListener('input', e=>{
    const t = e.target;
    if (t.tagName === 'TEXTAREA') autoGrow(t);

    if (t.dataset.path){
      const p = t.dataset.path;
      const detached = detachIfNeeded(p);
      if (detached) toast('Отвязано от источника — теперь это собственная копия');
      let v = t.value;
      if (t.dataset.csv !== undefined) v = v.split(',').map(s=>s.trim()).filter(Boolean);
      setPath(S.game, p, v);
      if (p.endsWith('.icon')){
        const pv = t.closest('.icon-row')?.querySelector('[data-icon-preview]');
        if (pv){ pv.innerHTML = `<i data-lucide="${escA(v||'star')}"></i>`; if(window.lucide)lucide.createIcons(); }
      }
      if (/^factions\.[^.]+\.name$/.test(p)){
        const key = p.split('.')[1];
        for (const c of Object.values(S.game.characters)){
          if (c.factionKey === key) c.faction = v;
        }
      }
      renderPreview();
      if (t.classList.contains('field')){
        const label = t.closest('label');
        if (label?.querySelector('.req-mark')) t.classList.toggle('missing', !t.value.trim());
      }
    }
  });

  app.addEventListener('change', e=>{
    const t = e.target;

    if (t.id === 'charFactionSelect'){
      const ch = S.game.characters[S.selectedCode];
      const newKey = t.value;
      const fac = S.game.factions[newKey];
      if (!fac) return;
      ch.factionKey = newKey;
      ch.faction = fac.name;
      ch.teamInfo = '';
      autoInheritFaction(ch, newKey);
      renderMain();
      toast('Наследованы общие элементы фракции «' + fac.name + '»');
      return;
    }

    if (t.id === 'editCodeType'){
      const key = S.editingCode;
      const cs = S.game.characters[S.selectedCode].codeSystem;
      cs[key] = codeTemplate(t.value, cs[key]);
      renderMain();
      return;
    }

    if (t.id === 'editLibCodeType'){
      const i = parseInt(t.dataset.idx);
      const it = S.game.library.codes[i];
      it.type = t.value;
      delete it.reveal; delete it.targets; delete it.name; delete it.description;
      delete it.details; delete it.icon; delete it.content; delete it._libRef;
      if (t.value === 'reveal') it.reveal = '';
      if (t.value === 'targets') it.targets = [];
      if (['features','ability','quest'].includes(t.value)) it._libRef = '';
      renderTabContent();
      if (window.lucide) lucide.createIcons();
      return;
    }

    if (t.id === 'editCodeKey'){
      const oldK = t.dataset.original;
      const newK = t.value.trim().toUpperCase().replace(/\s+/g,'_');
      t.value = newK;
      if (!newK || newK === oldK) return;
      if (newK.includes('.')){ toast('Точки недопустимы', true); t.value = oldK; return; }
      const cs = S.game.characters[S.selectedCode].codeSystem;
      if (cs[newK]){ toast('Код уже есть', true); t.value = oldK; return; }
      const rebuilt = {};
      for (const k in cs) rebuilt[k === oldK ? newK : k] = cs[k];
      S.game.characters[S.selectedCode].codeSystem = rebuilt;
      S.editingCode = newK;
      renderMain();
      return;
    }

    if (t.id === 'editLibCodeKey'){
      const i = parseInt(t.dataset.idx);
      const oldK = t.dataset.original;
      const newK = t.value.trim().toUpperCase().replace(/\s+/g,'_');
      t.value = newK;
      if (!newK || newK === oldK) return;
      if ((S.game.library.codes||[]).some((x, idx)=>idx !== i && x.key === newK)){ toast('Код уже есть', true); t.value = oldK; return; }
      S.game.library.codes[i].key = newK;
      renderMain();
      return;
    }

    if (t.id === 'editCharCode'){
      const oldC = t.dataset.original;
      const newC = t.value.trim().toUpperCase().replace(/\s+/g,'_');
      t.value = newC;
      if (!newC || newC === oldC) return;
      if (S.game.characters[newC]){ toast('Такой код есть', true); t.value = oldC; return; }
      const rebuilt = {};
      for (const k in S.game.characters) rebuilt[k === oldC ? newC : k] = S.game.characters[k];
      S.game.characters = rebuilt;
      S.selectedCode = newC;
      renderMain();
      return;
    }

    if (t.id === 'editFactionKey'){
      const oldK = t.dataset.original;
      const newK = t.value.trim().toUpperCase().replace(/\s+/g,'_');
      t.value = newK;
      if (!newK || newK === oldK) return;
      if (S.game.factions[newK]){ toast('Такая фракция есть', true); t.value = oldK; return; }
      const rebuilt = {};
      for (const k in S.game.factions) rebuilt[k === oldK ? newK : k] = S.game.factions[k];
      S.game.factions = rebuilt;
      for (const c of Object.values(S.game.characters)){
        if (c.factionKey === oldK) c.factionKey = newK;
        (c.features||[]).forEach(it=>{ if (it._fac && it._fac.startsWith(oldK + ':')) it._fac = newK + ':' + it._fac.split(':')[1]; });
        (c.abilities||[]).forEach(it=>{ if (it._fac && it._fac.startsWith(oldK + ':')) it._fac = newK + ':' + it._fac.split(':')[1]; });
        (c.quests||[]).forEach(it=>{ if (it._fac && it._fac.startsWith(oldK + ':')) it._fac = newK + ':' + it._fac.split(':')[1]; });
      }
      S.selectedFaction = newK;
      renderMain();
      return;
    }

    if (t.dataset.questBind !== undefined){
      const idx = parseInt(t.dataset.questBind);
      const kind = t.dataset.kind;
      const key = S.editingCode;
      const ch = S.game.characters[S.selectedCode];
      const q = ch.quests[idx];
      if (!q) return;
      const src = itemSource(q);
      let target = q;
      if (src !== 'own'){
        const resolved = resolveItem(q, 'quests', S.game);
        if (resolved){
          const copy = clone(resolved);
          delete copy.id; delete copy._lib; delete copy._fac; delete copy.$lib;
          delete copy._libId; delete copy._libRef; delete copy._fromFaction;
          copy.id = uid('it');
          ch.quests[idx] = copy;
          target = copy;
        }
      }
      const field = kind === 'ok' ? 'successfulCodes' : 'failedCodes';
      target[field] = target[field] || [];
      const pos = target[field].indexOf(key);
      if (t.checked){ if (pos === -1) target[field].push(key); }
      else { if (pos !== -1) target[field].splice(pos,1); }
      renderPreview();
      renderTabContent();
      return;
    }
  });

  app.addEventListener('click', e=>{
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const listPath = btn.dataset.list;
    const arr = getPath(S.game, listPath);
    if (!arr) return;
    const idx = btn.dataset.idx !== undefined ? parseInt(btn.dataset.idx) : null;
    if (action === 'add'){
      const kind = btn.dataset.kind || guessKind(listPath);
      arr.push(makeItemTemplate(kind));
    } else if (action === 'del'){
      if (!confirm('Удалить элемент?')) return;
      arr.splice(idx,1);
    } else if (action === 'up' && idx > 0){
      [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
    } else if (action === 'down' && idx < arr.length-1){
      [arr[idx+1], arr[idx]] = [arr[idx], arr[idx+1]];
    } else return;
    renderMain();
  });
}
function guessKind(path){
  if (path.endsWith('.features'))  return 'features';
  if (path.endsWith('.abilities')) return 'abilities';
  if (path.endsWith('.quests'))    return 'quests';
  if (path.endsWith('.inventory')) return 'inventory';
  return 'features';
}
function makeItemTemplate(kind){
  if (kind === 'features')  return { id: uid('it'), name:'Новая особенность', description:'', icon:'star' };
  if (kind === 'abilities') return { id: uid('it'), name:'Новая способность', description:'', icon:'zap' };
  if (kind === 'quests')    return { id: uid('it'), title:'Новое задание', description:'', successfulCodes:[], failedCodes:[] };
  if (kind === 'inventory') return { id: uid('it'), icon:'box', name:'Новый предмет', description:'' };
  return { id: uid('it'), name:'Новое', description:'' };
}
function codeTemplate(type, old){
  old = old || {};
  switch(type){
    case 'reveal':   return { reveal: old.reveal || '' };
    case 'features': return { type:'features', name: old.name || '', description: old.description || '', icon: old.icon || 'star' };
    case 'ability':  return { type:'ability',  name: old.name || '', description: old.description || '', icon: old.icon || 'zap' };
    case 'quest':    return { type:'quest',    name: old.name || '', content:{ description: old.content?.description || '' }, icon: old.icon || 'target' };
    case 'targets':  return { targets: old.targets || [] };
    default:         return old;
  }
}
attachHandlers();

/* ============================================================
   СТАРТ
   ============================================================ */
(function initApp(){
  try {
    const raw = localStorage.getItem('editor_draft');
    if (raw){
      const d = JSON.parse(raw);
      if (d && d.game && d.game.characters){
        S.game = normalizeGame(d.game);
        S.section = d.section || 'characters';
        S.selectedCode = d.selectedCode || Object.keys(S.game.characters)[0] || null;
        S.charTab = d.charTab || 'info';
        S.libKind = d.libKind || 'features';
        S.selectedFaction = d.selectedFaction || Object.keys(S.game.factions)[0] || null;
        S.fileName = d.fileName || null;
        S.fileHandle = null;
        renderMain();
        if (window.lucide) lucide.createIcons();
        return;
      }
    }
  } catch(e){}
  renderWelcome();
  if (window.lucide) lucide.createIcons();
})();
</script>
